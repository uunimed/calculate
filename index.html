<!DOCTYPE html>
<html lang="ka" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShogiGeld</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Particles.js CDN -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            animation: spin 0.8s linear infinite;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

    <!-- Login View -->
    <div id="login-view" class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-100 dark:bg-slate-950 overflow-hidden">
        <div id="particles-js"></div>
        <div class="relative z-10 bg-white/95 dark:bg-slate-800/90 backdrop-blur-md p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-200/80 dark:border-slate-700 w-full max-w-md text-center">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto mb-6 shadow-lg shadow-indigo-500/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">ShogiGeld</h2>            
            <form onsubmit="app.handleLogin(event)" class="space-y-4">
                <div>
                    <input type="password" id="login-code" placeholder="" required
                        class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white font-medium text-center text-lg tracking-widest">
                </div>
                <button type="submit" id="login-btn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-md shadow-indigo-500/20 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 flex items-center justify-center gap-2">
                    <span>შესვლა</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="main-app" class="hidden flex-1 flex flex-col min-h-full">
        <!-- Top Navigation Header -->
        <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 w-full shadow-sm">
            <div class="w-full px-4 sm:px-8 h-16 flex items-center justify-between">
                <button onclick="app.resetView()" class="group flex items-center gap-3 text-xl font-bold tracking-tight text-indigo-600 dark:text-indigo-400 hover:opacity-80 transition-opacity focus:outline-none">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </div>
                    <span>ShogiGeld</span>
                </button>

                <div class="flex items-center gap-2">
                    <!-- Settings Button -->
                    <button onclick="app.openSettingsModal()" aria-label="პარამეტრები" class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75"></path>
                        </svg>
                    </button>
                    <!-- Logout Button -->
                    <button onclick="app.handleLogout()" aria-label="გასვლა" class="p-2.5 rounded-xl text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/30 transition-colors focus:outline-none focus:ring-2 focus:ring-rose-500" title="გასვლა">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 w-full px-4 sm:px-8 py-8 space-y-8 max-w-7xl mx-auto">
            
            <!-- Dashboard Summary Bar -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">ბიუჯეტი</p>
                        <h3 id="display-total-budget" class="text-3xl font-bold text-slate-900 dark:text-white mt-1">0.00 €</h3>
                    </div>
                    <div class="w-14 h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 7.756a4.5 4.5 0 100 8.488M7.5 10.5h5.25m-5.25 3h5.25M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">ნაშთი</p>
                        <h3 id="display-remaining-budget" class="text-3xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">0.00 €</h3>
                    </div>
                    <div class="w-14 h-14 rounded-2xl bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Expense Form Card -->
            <section class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm w-full">
                <h2 id="form-heading" class="text-lg font-semibold text-slate-900 dark:text-white mb-4">დამატება</h2>
                <form id="expense-form" onsubmit="app.handleFormSubmit(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1.5"></label>
                            <div class="relative rounded-xl shadow-sm">
                                <input type="number" step="0.01" min="0.01" id="expense-amount" placeholder="" required
                                    class="w-full pl-4 pr-10 py-3.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white font-medium text-sm">
                                <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-500 dark:text-slate-400 font-semibold">
                                    €
                                </div>
                            </div>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1.5"></label>
                            <input type="text" id="expense-purpose" placeholder="" required
                                class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white font-medium text-sm">
                        </div>
                    </div>
                    <div class="flex items-center justify-end gap-3 pt-2">
                        <div id="cancel-edit-container"></div>
                        <button type="submit" id="submit-btn" class="w-full sm:w-auto px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-md shadow-indigo-500/20 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                            <span>დამატება</span>
                        </button>
                    </div>
                </form>
            </section>

            <!-- History Section -->
            <section class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm overflow-hidden w-full">
                <div class="p-6 sm:p-8 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-900 dark:text-white">სრული ისტორია</h2>
                    </div>
                    <div id="history-count" class="px-3.5 py-1 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 text-xs font-semibold rounded-full">
                        0 ჩანაწერი
                    </div>
                </div>

                <!-- Transactions List Table with Scrollable container (Max 10 items visible) -->
                <div class="max-h-[500px] overflow-y-auto w-full">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 z-10 bg-slate-50 dark:bg-slate-900">
                            <tr class="text-slate-400 text-xs font-semibold uppercase tracking-wider border-b border-slate-200 dark:border-slate-700">
                                <th class="py-4 px-6 sm:px-8">დანიშნულება</th>
                                <th class="py-4 px-6">საწყისი / თანხა</th>
                                <th class="py-4 px-6">ნაშთი</th>
                                <th class="py-4 px-6">დრო</th>
                                <th class="py-4 px-6 sm:px-8 text-right">მოქმედება</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-tbody" class="divide-y divide-slate-200 dark:divide-slate-700 text-sm">
                            <!-- Dynamically populated rows -->
                        </tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden py-20 px-4 text-center w-full">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-400">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <h3 class="text-base font-semibold text-slate-700 dark:text-slate-300">ისტორია ცარიელია</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">დაამატეთ პირველი ხარჯი ზემოთ მოცემული ფორმიდან.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Settings Modal (py-[1cm]) -->
    <div id="settings-modal" class="fixed inset-0 z-40 flex items-center justify-center px-4 sm:px-8 py-[1cm] bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="settings-modal-content" class="bg-white dark:bg-slate-800 w-full h-full max-h-full rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300 flex flex-col overflow-hidden">
            
            <div class="px-6 sm:px-8 py-5 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between shrink-0">
                <h3 class="text-lg font-semibold text-slate-900 dark:text-white flex items-center gap-2.5">
                    <svg class="w-6 h-6 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75"></path></svg>
                    <span>პარამეტრები</span>
                </h3>
                <button onclick="app.closeSettingsModal()" aria-label="დახურვა" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="p-6 sm:p-8 space-y-6 flex-1 overflow-y-auto">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-900/50 p-5 rounded-xl border border-slate-200/60 dark:border-slate-700/60">
                    <div>
                        <span class="text-xs text-slate-500 dark:text-slate-400 block font-medium uppercase tracking-wider">ბიუჯეტი</span>
                        <span id="modal-total-display" class="text-2xl font-bold text-slate-900 dark:text-white mt-1 block">0.00 €</span>
                    </div>
                    <div>
                        <span class="text-xs text-slate-500 dark:text-slate-400 block font-medium uppercase tracking-wider">ნაშთი</span>
                        <span id="modal-remaining-display" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1 block">0.00 €</span>
                    </div>
                </div>

                <!-- Top-up Form -->
                <div class="bg-slate-50/50 dark:bg-slate-900/30 p-6 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 space-y-3">
                    <label class="block text-base font-semibold text-slate-800 dark:text-slate-200">შევსება</label>
                    <form onsubmit="app.handleTopUp(event)" class="flex flex-col sm:flex-row gap-3 pt-1">
                        <div class="relative flex-1">
                            <input type="number" step="0.01" min="0.01" id="topup-amount" placeholder="" required
                                class="w-full pl-4 pr-10 py-3.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white font-medium text-sm">
                            <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-500 dark:text-slate-400 font-semibold">
                                €
                            </div>
                        </div>
                        <button type="submit" id="topup-btn" class="px-6 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl shadow-md shadow-emerald-500/25 transition-all flex items-center justify-center gap-2 whitespace-nowrap">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                            <span>შევსება</span>
                        </button>
                    </form>
                </div>

                <!-- Set Base Budget Directly Option -->
                <div class="bg-slate-50/50 dark:bg-slate-900/30 p-6 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 space-y-3">
                    <label class="block text-base font-semibold text-slate-800 dark:text-slate-200">ბიუჯეტის ხელახლა მითითება</label>
                    <form onsubmit="app.handleSetBaseBudget(event)" class="flex flex-col sm:flex-row gap-3 pt-1">
                        <div class="relative flex-1">
                            <input type="number" step="0.01" min="0" id="base-budget-amount" placeholder="" required
                                class="w-full pl-4 pr-10 py-3.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white font-medium text-sm">
                            <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-500 dark:text-slate-400 font-semibold">
                                €
                            </div>
                        </div>
                        <button type="submit" id="base-btn" class="px-6 py-3.5 bg-slate-800 dark:bg-slate-700 hover:bg-slate-700 dark:hover:bg-slate-600 text-white font-medium rounded-xl transition-all whitespace-nowrap flex items-center justify-center gap-2">
                            <span>განახლება</span>
                        </button>
                    </form>
                </div>
            </div>

            <div class="px-6 sm:px-8 py-4 bg-slate-50 dark:bg-slate-900/40 border-t border-slate-200 dark:border-slate-700 flex justify-end shrink-0">
                <button onclick="app.closeSettingsModal()" class="px-6 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium rounded-xl hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors text-sm">
                    დახურვა
                </button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-[60] flex items-center justify-center px-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="delete-modal-content" class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-300 p-6 text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-rose-100 dark:bg-rose-900/30 flex items-center justify-center text-rose-600 dark:text-rose-400">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">წაშლის დადასტურება</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">დარწმუნებული ხართ, რომ გსურთ წაშლა?</p>
            <div class="flex items-center justify-center gap-3">
                <button onclick="app.closeDeleteModal()" class="px-5 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium rounded-xl hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors text-sm">გაუქმება</button>
                <button onclick="app.confirmDelete()" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-medium rounded-xl transition-colors text-sm">წაშლა</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[70] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCw8EjDno6Sax2ndkO0_Jph_5XtbQ9P1dQ",
            authDomain: "sign-5779f.firebaseapp.com",
            databaseURL: "https://sign-5779f-default-rtdb.firebaseio.com",
            projectId: "sign-5779f",
            storageBucket: "sign-5779f.firebasestorage.app",
            messagingSenderId: "1040469341314",
            appId: "1:1040469341314:web:708d7a3b6dd600f8dbb09b",
            measurementId: "G-QD80CK9VPP"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        class ShogiApp {
            constructor() {
                this.state = {
                    totalBudget: 0,
                    transactions: [],
                    editingId: null,
                    deletingId: null,
                    isLoggedIn: false
                };
                
                if (localStorage.getItem('shogi_logged_in') === 'true') {
                    this.state.isLoggedIn = true;
                    this.showMainApp();
                } else {
                    this.initParticles();
                }
            }

            initParticles() {
                if (window.particlesJS) {
                    particlesJS('particles-js', {
                        particles: {
                            number: { value: 50, density: { enable: true, value_area: 800 } },
                            color: { value: '#818cf8' },
                            shape: { type: 'circle' },
                            opacity: { value: 0.6, random: false },
                            size: { value: 3, random: true },
                            line_linked: { enable: true, distance: 150, color: '#818cf8', opacity: 0.3, width: 1 },
                            move: { enable: true, speed: 2.5, direction: 'none', random: false, straight: false, out_mode: 'out', bounce: false }
                        },
                        interactivity: {
                            detect_on: 'canvas',
                            events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true }
                        },
                        retina_detect: true
                    });
                }
            }

            handleLogin(e) {
                e.preventDefault();
                const code = document.getElementById('login-code').value.trim();
                const loginBtn = document.getElementById('login-btn');
                
                const originalHTML = loginBtn.innerHTML;
                loginBtn.disabled = true;
                loginBtn.innerHTML = `
                    <svg class="w-5 h-5 animate-spin-custom text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span>შემოწმება...</span>
                `;

                setTimeout(() => {
                    if (code === '200011') {
                        this.state.isLoggedIn = true;
                        localStorage.setItem('shogi_logged_in', 'true');
                        this.showMainApp();
                        this.showNotification("წარმატებით შეხვედით სისტემაში.", "success");
                    } else {
                        this.showNotification("არასწორი კოდია!", "error");
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = originalHTML;
                    }
                }, 400);
            }

            handleLogout() {
                this.state.isLoggedIn = false;
                localStorage.removeItem('shogi_logged_in');
                document.getElementById('main-app').classList.add('hidden');
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('login-code').value = '';
                const loginBtn = document.getElementById('login-btn');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>შესვლა</span>';
                this.initParticles();
                this.showNotification("წარმატებით გამოხვედით სისტემიდან.", "info");
            }

            showMainApp() {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                this.initFirebaseListener();
            }

            initFirebaseListener() {
                const dbRef = db.ref('shogi_app_state');
                dbRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        this.state.totalBudget = data.totalBudget || 0;
                        this.state.transactions = data.transactions || [];
                    } else {
                        this.state.totalBudget = 0;
                        this.state.transactions = [];
                    }
                    this.state.transactions.forEach(t => { if (!t.type) t.type = 'expense'; });
                    this.recalculateBalances();
                    this.render();
                }, (error) => {
                    console.error("Firebase read failed: ", error);
                    this.showNotification("მონაცემთა ბაზასთან კავშირის შეცდომა.", "error");
                });
            }

            saveToFirebase(callback) {
                db.ref('shogi_app_state').set({
                    totalBudget: this.state.totalBudget,
                    transactions: this.state.transactions
                }).then(() => {
                    if (callback) callback();
                }).catch((error) => {
                    console.error("Firebase write failed: ", error);
                    this.showNotification("ვერ მოხერხდა სინქრონიზაცია.", "error");
                    if (callback) callback();
                });
            }

            resetView() {
                this.state.editingId = null;
                document.getElementById('expense-form').reset();
                document.getElementById('form-heading').textContent = "ახალი ხარჯის დამატება";
                document.getElementById('cancel-edit-container').innerHTML = '';
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    <span>დამატება</span>
                `;
                this.render();
                this.showNotification("გვერდი განახლდა.", "info");
            }

            getFormattedTime() {
                const now = new Date();
                return now.toLocaleDateString('ka-GE', { year: 'numeric', month: '2-digit', day: '2-digit' }) + ' ' + now.toLocaleTimeString('ka-GE', { hour: '2-digit', minute: '2-digit' });
            }

            recalculateBalances() {
                let totalBudgetAtTime = 0;
                let sumExpensesAtTime = 0;

                this.state.transactions.forEach(t => {
                    t.budgetBefore = totalBudgetAtTime - sumExpensesAtTime;
                    if (t.type === 'topup') {
                        totalBudgetAtTime += t.amount;
                    } else if (t.type === 'base_set') {
                        totalBudgetAtTime = t.amount;
                    } else if (t.type === 'expense') {
                        sumExpensesAtTime += t.amount;
                    }
                    t.remainingAfter = totalBudgetAtTime - sumExpensesAtTime;
                });
                
                this.state.totalBudget = totalBudgetAtTime;
            }

            calculateRemaining() {
                let sumExpenses = 0;
                this.state.transactions.forEach(t => {
                    if (t.type === 'expense') sumExpenses += t.amount;
                });
                return this.state.totalBudget - sumExpenses;
            }

            render() {
                const remaining = this.calculateRemaining();
                
                document.getElementById('display-total-budget').textContent = `${this.state.totalBudget.toFixed(2)} €`;
                const remElem = document.getElementById('display-remaining-budget');
                remElem.textContent = `${remaining.toFixed(2)} €`;
                remElem.className = remaining < 0 ? "text-3xl font-bold text-rose-600 dark:text-rose-400 mt-1" : "text-3xl font-bold text-emerald-600 dark:text-emerald-400 mt-1";

                document.getElementById('modal-total-display').textContent = `${this.state.totalBudget.toFixed(2)} €`;
                const modalRemElem = document.getElementById('modal-remaining-display');
                modalRemElem.textContent = `${remaining.toFixed(2)} €`;
                modalRemElem.className = remaining < 0 ? "text-2xl font-bold text-rose-600 dark:text-rose-400 mt-1 block" : "text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1 block";

                const tbody = document.getElementById('transactions-tbody');
                const emptyState = document.getElementById('empty-state');
                const historyCount = document.getElementById('history-count');

                historyCount.textContent = `${this.state.transactions.length} ჩანაწერი`;

                if (this.state.transactions.length === 0) {
                    tbody.innerHTML = '';
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    let html = '';
                    const sortedTransactions = [...this.state.transactions].reverse();

                    sortedTransactions.forEach((tx, index) => {
                        const isLatest = (index === 0);
                        const isBudgetChange = (tx.type === 'topup' || tx.type === 'base_set');

                        if (isBudgetChange) {
                            const message = tx.type === 'topup' 
                                ? `ბიუჯეტის შევსება: +${tx.amount.toFixed(2)} €` 
                                : `ბიუჯეტის განახლება: ${tx.amount.toFixed(2)} €`;

                            html += `
                                <tr class="bg-indigo-50/70 dark:bg-indigo-900/20 border-y border-indigo-100 dark:border-indigo-800/40">
                                    <td colspan="4" class="py-3.5 px-6 sm:px-8 text-center text-xs font-semibold text-indigo-700 dark:text-indigo-300">
                                        <div class="flex items-center justify-center gap-2">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                            ${message} 
                                            <span class="text-indigo-400 dark:text-indigo-500 font-normal ml-1">(${tx.timestamp})</span>
                                        </div>
                                    </td>
                                    <td class="py-3 px-6 sm:px-8 text-right">
                                        <button onclick="app.deleteTransaction('${tx.id}')" aria-label="წაშლა" class="p-1.5 text-indigo-400 hover:text-rose-600 dark:hover:text-rose-400 rounded-lg transition-colors inline-block">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </td>
                                </tr>
                            `;
                        } else {
                            const rowBgClass = isLatest && tx.type === 'expense'
                                ? "bg-amber-50/60 dark:bg-amber-950/20 hover:bg-amber-50 dark:hover:bg-amber-950/40" 
                                : "hover:bg-slate-50/80 dark:hover:bg-slate-700/30";

                            html += `
                                <tr class="${rowBgClass} transition-colors">
                                    <td class="py-4 px-6 sm:px-8 font-medium text-slate-900 dark:text-white flex items-center gap-2">
                                        ${isLatest ? '<span class="w-2 h-2 rounded-full bg-amber-500 inline-block" title="ბოლოს დამატებული"></span>' : ''}
                                        ${this.escapeHtml(tx.purpose)}
                                    </td>
                                    <td class="py-4 px-6 font-semibold text-slate-700 dark:text-slate-300 whitespace-nowrap">
                                        <span class="text-xs text-slate-400 block font-normal">საწყისი: ${(tx.budgetBefore !== undefined ? tx.budgetBefore : 0).toFixed(2)} €</span>
                                        <span class="text-rose-600 dark:text-rose-400">-${tx.amount.toFixed(2)} €</span>
                                    </td>
                                    <td class="py-4 px-6 font-medium text-slate-700 dark:text-slate-300 whitespace-nowrap">
                                        ${tx.remainingAfter.toFixed(2)} €
                                    </td>
                                    <td class="py-4 px-6 text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap">
                                        ${tx.timestamp}
                                    </td>
                                    <td class="py-4 px-6 sm:px-8 text-right whitespace-nowrap">
                                        <div class="inline-flex items-center gap-2">
                                            <button onclick="app.startEdit('${tx.id}')" aria-label="რედაქტირება" class="p-2 text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 rounded-xl transition-colors">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                            </button>
                                            <button onclick="app.deleteTransaction('${tx.id}')" aria-label="წაშლა" class="p-2 text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded-xl transition-colors">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `;
                        }
                    });
                    tbody.innerHTML = html;
                }
            }

            handleFormSubmit(e) {
                e.preventDefault();
                const amountInput = document.getElementById('expense-amount');
                const purposeInput = document.getElementById('expense-purpose');
                const submitBtn = document.getElementById('submit-btn');

                const amount = parseFloat(amountInput.value);
                const purpose = purposeInput.value.trim();

                if (isNaN(amount) || amount <= 0) {
                    this.showNotification("გთხოვთ შეიყვანოთ სწორი თანხა ევროში.", "error");
                    return;
                }

                if (!purpose) {
                    this.showNotification("გთხოვთ მიუთითოთ დანიშნულება.", "error");
                    return;
                }

                const originalBtnHTML = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = `
                    <svg class="w-5 h-5 animate-spin-custom text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span>მუშავდება...</span>
                `;

                const timestamp = this.getFormattedTime();

                if (this.state.editingId) {
                    const tx = this.state.transactions.find(t => t.id === this.state.editingId);
                    if (tx) {
                        tx.amount = amount;
                        tx.purpose = purpose;
                        tx.timestamp = timestamp + ' (რედაქტირებულია)';
                    }
                    this.state.editingId = null;
                    document.getElementById('form-heading').textContent = "ახალი ხარჯის დამატება";
                    document.getElementById('cancel-edit-container').innerHTML = '';
                    this.showNotification("ხარჯი წარმატებით განახლდა.", "success");
                } else {
                    const newTx = {
                        id: 'tx_' + Date.now(),
                        type: 'expense',
                        amount: amount,
                        purpose: purpose,
                        timestamp: timestamp,
                        remainingAfter: 0
                    };
                    this.state.transactions.push(newTx);
                    this.showNotification("ხარჯი წარმატებით დაემატა.", "success");
                }

                this.recalculateBalances();
                this.saveToFirebase(() => {
                    document.getElementById('expense-form').reset();
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnHTML;
                    this.render();
                });
            }

            startEdit(id) {
                const tx = this.state.transactions.find(t => t.id === id);
                if (!tx || tx.type !== 'expense') return;

                this.state.editingId = id;
                document.getElementById('expense-amount').value = tx.amount;
                document.getElementById('expense-purpose').value = tx.purpose;
                document.getElementById('form-heading').textContent = "ხარჯის რედაქტირება";
                
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg><span>შენახვა</span>`;
                document.getElementById('cancel-edit-container').innerHTML = `<button type="button" onclick="app.resetView()" class="px-4 py-3.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium rounded-xl hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors text-sm">გაუქმება</button>`;

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            deleteTransaction(id) {
                this.state.deletingId = id;
                const modal = document.getElementById('delete-modal');
                const content = document.getElementById('delete-modal-content');
                modal.classList.remove('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }

            closeDeleteModal() {
                this.state.deletingId = null;
                const modal = document.getElementById('delete-modal');
                const content = document.getElementById('delete-modal-content');
                modal.classList.add('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
            }

            confirmDelete() {
                if (!this.state.deletingId) return;
                this.state.transactions = this.state.transactions.filter(t => t.id !== this.state.deletingId);
                this.recalculateBalances();
                this.saveToFirebase(() => {
                    this.render();
                    this.showNotification("ჩანაწერი წაიშალა.", "info");
                    this.closeDeleteModal();
                });
            }

            openSettingsModal() {
                const modal = document.getElementById('settings-modal');
                const content = document.getElementById('settings-modal-content');
                modal.classList.remove('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }

            closeSettingsModal() {
                const modal = document.getElementById('settings-modal');
                const content = document.getElementById('settings-modal-content');
                modal.classList.add('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
            }

            handleTopUp(e) {
                e.preventDefault();
                const input = document.getElementById('topup-amount');
                const topupBtn = document.getElementById('topup-btn');
                const amount = parseFloat(input.value);

                if (isNaN(amount) || amount <= 0) {
                    this.showNotification("გთხოვთ შეიყვანოთ სწორი შესავსები თანხა.", "error");
                    return;
                }

                const originalHTML = topupBtn.innerHTML;
                topupBtn.disabled = true;
                topupBtn.innerHTML = `
                    <svg class="w-5 h-5 animate-spin-custom text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span>იტვირთება...</span>
                `;

                const newTx = {
                    id: 'tx_' + Date.now(),
                    type: 'topup',
                    amount: amount,
                    timestamp: this.getFormattedTime(),
                    remainingAfter: 0
                };
                
                this.state.transactions.push(newTx);
                this.recalculateBalances();
                this.saveToFirebase(() => {
                    input.value = '';
                    topupBtn.disabled = false;
                    topupBtn.innerHTML = originalHTML;
                    this.render();
                    this.showNotification(`ბიუჯეტი წარმატებით შეივსო +${amount.toFixed(2)} €-ით.`, "success");
                });
            }

            handleSetBaseBudget(e) {
                e.preventDefault();
                const input = document.getElementById('base-budget-amount');
                const baseBtn = document.getElementById('base-btn');
                const amount = parseFloat(input.value);

                if (isNaN(amount) || amount < 0) {
                    this.showNotification("გთხოვთ შეიყვანოთ სწორი თანხა.", "error");
                    return;
                }

                const originalHTML = baseBtn.innerHTML;
                baseBtn.disabled = true;
                baseBtn.innerHTML = `
                    <svg class="w-5 h-5 animate-spin-custom text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span>განახლდება...</span>
                `;

                const newTx = {
                    id: 'tx_' + Date.now(),
                    type: 'base_set',
                    amount: amount,
                    timestamp: this.getFormattedTime(),
                    remainingAfter: 0
                };
                
                this.state.transactions.push(newTx);
                this.recalculateBalances();
                this.saveToFirebase(() => {
                    input.value = '';
                    baseBtn.disabled = false;
                    baseBtn.innerHTML = originalHTML;
                    this.render();
                    this.showNotification("ჯამური ბიუჯეტი განახლდა.", "success");
                });
            }

            showNotification(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                let bgClass = 'bg-slate-900 text-white';
                if (type === 'success') bgClass = 'bg-emerald-600 text-white';
                if (type === 'error') bgClass = 'bg-rose-600 text-white';
                if (type === 'info') bgClass = 'bg-indigo-600 text-white';

                toast.className = `${bgClass} px-5 py-3.5 rounded-xl shadow-lg text-sm font-medium transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto flex items-center gap-3`;
                toast.innerHTML = `<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>${this.escapeHtml(message)}</span>`;

                container.appendChild(toast);
                setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 20);
                setTimeout(() => {
                    toast.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

            escapeHtml(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }
        }

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new ShogiApp();
        });
    </script>
</body>
</html>
